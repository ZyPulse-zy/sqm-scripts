name: Verify SQM optional directions and startup failures
on:
  push:
    branches: [bootstrap/sqm-review-194]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 0
      - name: Verify both source archives and import candidate
        run: |
          base64 -d control/ci/review/candidate.bundle.b64 > "$RUNNER_TEMP/candidate.bundle"
          base64 -d control/ci/review/original.bundle.b64 > "$RUNNER_TEMP/original.bundle"
          printf '%s  %s\n' 6cdc94aeabbe9aa2f8f866a8c3f15a0796072b3c8f1d49ba5b5eb03f1438ba42 "$RUNNER_TEMP/candidate.bundle" | sha256sum -c -
          printf '%s  %s\n' 82c4e99c5097cdd1a5faa91c55772290f4619c240121a4b601936ad10947ce18 "$RUNNER_TEMP/original.bundle" | sha256sum -c -
          git init source
          git -C source fetch --no-tags https://github.com/tohojo/sqm-scripts.git 77cf89e82ced9b215cc02f64fd471f5278b7d031
          git -C source fetch "$RUNNER_TEMP/original.bundle" HEAD:refs/remotes/import/original
          test "$(git -C source rev-parse refs/remotes/import/original)" = bf6f0e7913374624fa9348f7ab86e58e582f1862
          git -C source fetch "$RUNNER_TEMP/candidate.bundle" HEAD
          test "$(git -C source rev-parse FETCH_HEAD)" = 2e581cd032fef269b4964188e58b774739dd8939
          git -C source checkout --detach FETCH_HEAD
          git -C source fetch --no-tags https://github.com/ZyPulse-zy/sqm-scripts.git b79b4447ca210594895dc4e8e41ed826f909c87b
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2 busybox python3
      - name: Independent compatibility and real CAKE validation
        run: bash control/ci/review/verify.sh "$PWD/source" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqm-indent-194-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
  publish-validated:
    needs: kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact validated source outside the PR branch
        run: |
          base64 -d ci/review/candidate.bundle.b64 > "$RUNNER_TEMP/candidate.bundle"
          printf '%s  %s\n' 6cdc94aeabbe9aa2f8f866a8c3f15a0796072b3c8f1d49ba5b5eb03f1438ba42 "$RUNNER_TEMP/candidate.bundle" | sha256sum -c -
          git fetch "$RUNNER_TEMP/candidate.bundle" HEAD:refs/remotes/import/candidate
          test "$(git rev-parse refs/remotes/import/candidate)" = 2e581cd032fef269b4964188e58b774739dd8939
          git push --force-with-lease=refs/heads/validated/sqm-indent-194-20261020: origin refs/remotes/import/candidate:refs/heads/validated/sqm-indent-194-20261020

