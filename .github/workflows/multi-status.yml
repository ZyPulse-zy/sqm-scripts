name: Verify SQM multi-interface startup status
on:
  push:
    branches: [bootstrap/multi-interface-status]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import exact signed-off source
        run: |
          git fetch origin 5eb9982a7a202442bf214a0d2ff947600098d3d3
          base64 -d ci/multi-status/source.bundle.b64 > "$RUNNER_TEMP/source.bundle"
          echo '5172da8b7a535a5a4b77d3f7b9930ffba7c0a614b4cff81d9a96b4f1de99f305  '"$RUNNER_TEMP/source.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/source.bundle"
          git fetch "$RUNNER_TEMP/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = bf6f0e7913374624fa9348f7ab86e58e582f1862
          git push origin FETCH_HEAD:refs/heads/fix/multi-interface-status
  kernel:
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-interface-status
          fetch-depth: 0
          path: source
      - run: sudo apt-get update -qq && sudo apt-get install -y iproute2 busybox python3 curl
      - run: bash control/ci/multi-status/verify.sh "$PWD/source" "$RUNNER_TEMP/sqm-multi-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqm-multi-interface-kernel-evidence
          path: ${{ runner.temp }}/sqm-multi-evidence
