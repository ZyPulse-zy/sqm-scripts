name: Validate signed startup fix
on:
  push:
    branches: [bootstrap/startup-import]
permissions:
  contents: write
jobs:
  validate-import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Import exact signed commit
        run: |
          base64 -d .bootstrap/startup.bundle.b64 > /tmp/startup.bundle
          echo '444ee963f5d02ade0e59b3124269c140020d9a025efa36d64e29f56d6c4dc4bb  /tmp/startup.bundle' | sha256sum -c -
          git fetch /tmp/startup.bundle HEAD:refs/remotes/import/candidate
          test "$(git rev-parse refs/remotes/import/candidate)" = ca6da0cda92c2cf944353ea53492880095ac3eae
          git checkout --detach refs/remotes/import/candidate
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 busybox
          sudo modprobe sch_cake
          sudo modprobe dummy
      - name: Run isolated startup regressions
        run: |
          sudo tests/start-failure.sh
          mkdir -p /tmp/sqm-shell
          ln -s "$(command -v busybox)" /tmp/sqm-shell/ash
          sudo env SQM_TEST_SHELL=/tmp/sqm-shell/ash tests/start-failure.sh
      - name: Publish exact tested branch
        run: git push --force-with-lease=refs/heads/fix/startup-failure-status:77cf89e82ced9b215cc02f64fd471f5278b7d031 origin HEAD:refs/heads/fix/startup-failure-status
